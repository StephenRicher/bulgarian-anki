
[project]
name = "bulgarian-anki"
version = "0.1.0"
description = "Tools for generating Anki decks for language learning."
authors = [
    { name = "Stephen Richer" },
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Education",
    "Natural Language :: Bulgarian",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
genanki = "^0.13.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.0"
pytest = "^9.0.0"

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [".git", "__pycache__", ".poetry"]

[tool.ruff.lint]
select = ["E4", "E501", "E7", "E9", "F", "B", "I", "UP"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
